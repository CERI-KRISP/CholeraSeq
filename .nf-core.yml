repository_type: pipeline
lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cholera_analysis_nf_logo_light.png
    - docs/images/nf-core-cholera_analysis_nf_logo_light.png
    - docs/images/nf-core-cholera_analysis_nf_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  # This pipeline predates nf-schema and still uses the older nf-core
  # convention: nextflow_schema.json in JSON Schema draft-07 (definitions/
  # allOf), validated at runtime by the custom lib/NfcoreSchema.groovy and
  # lib/NfcoreTemplate.groovy classes. nf-core/tools 4.x's schema_lint check
  # assumes the newer nf-schema plugin convention (draft 2020-12/$defs) and
  # hard-fails (not just warns) on the draft mismatch, blocking every other
  # lint check from running at all.
  #
  # Converting nextflow_schema.json's structure alone would satisfy this
  # check while breaking real parameter validation at runtime, since
  # lib/NfcoreSchema.groovy still expects the old structure - the correct
  # fix is a full migration to the nf-schema plugin (replacing
  # lib/NfcoreSchema.groovy/NfcoreTemplate.groovy pipeline-wide), which is a
  # deliberate, separate piece of work, not something to bundle into this
  # integration. Disabling just this one check here so the rest of lint can
  # actually run.
  schema_lint: False